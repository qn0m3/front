<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Task 1</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1>Добро пожаловать!</h1>

    <p>
        <i>
            <span class="red">П</span><span class="blue">р</span><span class="red">и</span><span class="blue">в</span><span class="red">е</span><span class="blue">т</span><span class="red">с</span><span class="blue">т</span><span class="red">в</span><span class="blue">у</span><span class="red">е</span><span class="blue">м</span>
        </i>
        <u>
            <span class="red">в</span><span class="blue">а</span><span class="red">с</span>
        </u>
        <b>
            <span class="red">в</span> <span class="blue">н</span><span class="red">а</span><span class="blue">ш</span><span class="red">е</span><span class="blue">м</span>
        </b>
        <a href="#">магазине</a>!
    </p>

    <p>
        <span class="tag-bracket">&lt;h1&gt;</span><span class="funny-text">Теорема Пифагора</span><span class="tag-bracket">&lt;/h1&gt;</span>:
        c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>
    </p>

    <table>
        <tr>
            <th colspan="2">Информация</th>
        </tr>
        <tr>
            <td>Старая цена: <s>1000 ₽</s></td>
            <td>Новая цена: 500 ₽</td>
        </tr>
    </table>
</div>
</body>
</html>
