<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин и теорема</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px 14px;
        }
    </style>
</head>
<body>
<h2>Добро пожаловать!</h2>

<p>
    <i>Приветствуем</i>
    <u>вас</u>
    <b>в нашем</b>
    <a href="#">магазине</a>!
</p>

<p>
    &lt;h1&gt;Теорема Пифагора&lt;/h1&gt;:
    c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>
</p>

<table>
    <tr>
        <th colspan="2">Информация</th>
    </tr>
    <tr>
        <td>Старая цена: <s>1000 ₽</s></td>
        <td>Новая цена: 500 ₽</td>
    </tr>
</table>
</body>
</html>
